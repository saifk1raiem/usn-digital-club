services:
  postgres:
    image: postgres:16-alpine
    container_name: usn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usn
      POSTGRES_USER: usn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - usn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usn -d usn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  usn_postgres_data:
